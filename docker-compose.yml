services:

  database:
    image: postgres:17-alpine
    env_file:
      - server/.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    container_name: database-container
    ports:
      - "5432:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server-container
    env_file:
      - server/.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      PORT: ${PORT}
      BRANCH_JWT_SECRET: ${BRANCH_JWT_SECRET}
    ports:
      - "8085:8085"
    depends_on:
      database:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: client-container
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_DOCKER_SERVER_URL}
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres-volume: