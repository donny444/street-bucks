# NGINX Configuration for Street Bucks - Local Build (Built Next.js + Backend API)
# This configuration serves the built Next.js application and proxies API requests to the backend
#
# Setup:
#   1. Build Next.js: npm run build
#   2. Start backend server: cd server && npm run start (port 8085)
#   3. Start NGINX with this config (port 80)
#   4. Access the app at http://localhost

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # Upstream for backend API
    upstream backend {
        server localhost:8085;
    }

    server {
        listen       80;
        server_name  localhost;

        # Increase client body size for file uploads
        client_max_body_size 50M;

        # Proxy headers for proper request forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Root directory for Next.js build output
        root /;

        # ==========================================
        # Backend API Routes (NestJS on port 8085)
        # ==========================================

        # Branch authentication and management
        location /branches {
            proxy_pass http://backend;
        }

        # User administration and attendance
        location /users {
            proxy_pass http://backend;
        }

        # Menu catalogue endpoints
        location /menus {
            proxy_pass http://backend;
        }

        # Order management endpoints
        location /orders {
            proxy_pass http://backend;
        }

        # Stock/inventory management
        location /stocks {
            proxy_pass http://backend;
        }

        # Recipe management
        location /recipes {
            proxy_pass http://backend;
        }

        # Ingredient endpoints
        location /ingredients {
            proxy_pass http://backend;
        }

        # Insight and analytics endpoints
        location /insights {
            proxy_pass http://backend;
        }

        # Static assets (menus, receipts, recipes images)
        location /assets {
            proxy_pass http://backend;
        }

        # ==========================================
        # Frontend Routes (Built Next.js Static Files)
        # ==========================================

        # Next.js static assets
        location /_next/static {
            alias {{WORKSPACE}}/out/_next/static;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Service worker
        location /sw.js {
            alias {{WORKSPACE}}/out/sw.js;
            expires 1d;
        }

        # Web app manifest
        location /manifest.json {
            alias {{WORKSPACE}}/out/manifest.json;
            expires 1d;
        }

        # Public icons
        location /icons {
            alias {{WORKSPACE}}/public/icons;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # All other routes serve index.html for SPA routing
        location / {
            alias {{WORKSPACE}}/out/;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }

        # Error pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
